<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #F1F5F9;
    overflow-y: auto;
    overflow-x: hidden;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 0 14px;
    padding: 0 18px 28px;
    align-items: start;
    min-height: 100%;
  }
  .col {
    display: flex;
    flex-direction: column;
    background: #FAFBFC;
    border: 1px solid #E2E8F0;
    border-top: none;
    border-radius: 0 0 12px 12px;
    min-width: 0;
    transition: background .15s, border-color .15s;
  }
  /* 列头：sticky 常驻视口；每列带状态色点 */
  .col-head {
    position: sticky;
    top: 0;
    z-index: 5;
    background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
    border: 1px solid #E2E8F0;
    border-radius: 12px 12px 0 0;
    padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
  }
  .col-title { font-size: 14px; font-weight: 700; color: #0F172A; display: flex; align-items: center; gap: 7px; }
  .col-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot-inprogress { background: #F59E0B; }
  .dot-testable { background: #3B82F6; }
  .dot-testing { background: #8B5CF6; }
  .dot-completed { background: #10B981; }
  .dot-closed { background: #94A3B8; }
  .dot-default { background: #CBD5E1; }
  .col-meta { font-size: 12px; color: #64748B; margin-top: 5px; letter-spacing: .2px; }
  .col-body { padding: 2px; min-height: 60px; }
  .col.drag-over { background: #EFF6FF; border-color: #60A5FA; }

  /* 卡片 */
  .card {
    position: relative;
    margin: 11px 10px 10px;
    padding: 12px 13px 12px 19px;
    border: 1px solid #E2E8F0;
    border-radius: 10px;
    background: #FFFFFF;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
    cursor: grab;
    display: flex; flex-direction: column;
    transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(15, 23, 42, .10);
    border-color: #CBD5E1;
    z-index: 2;
  }
  .card.dragging { opacity: .45; }
  .card .bar {
    position: absolute; left: 5px; top: 14px; bottom: 14px; width: 4px; border-radius: 2px;
  }
  /* 状态只用左条区分，卡片统一白底 */
  .bar-inprogress { background: #F59E0B; }
  .bar-completed  { background: #10B981; }
  .bar-closed     { background: #94A3B8; }
  .bar-testable { background: #3B82F6; }
  .bar-testing  { background: #8B5CF6; }
  .bar-default  { background: #CBD5E1; }

  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-id { font-size: 12px; color: #64748B; font-weight: 600; letter-spacing: .3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; flex: none; border: 1px solid #E2E8F0; }
  .card { margin-top: 11px; }
  .card-title {
    font-size: 13.5px; font-weight: 600; color: #1E293B;
    margin-top: 8px; line-height: 1.45; word-break: break-all;
    min-height: calc(1.45em * 2);   /* 标题恒定占两行：短标题不产生空白带 */
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* 徽章区：自然换行完整显示，不再截断 */
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .badge {
    font-size: 11px; line-height: 1; padding: 5px 8px; border-radius: 6px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .badge-status { background: #EFF6FF; border-color: #BFDBFE; color: #1D4ED8; }
  .badge-severity { background: #F8FAFC; border-color: #E2E8F0; color: #334155; display: inline-flex; align-items: center; gap: 5px; }
  .badge-severity .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .badge-priority { background: #F1F5F9; border-color: #E2E8F0; color: #0F172A; font-weight: 600; }
  .prio-最高 { background: #FEE2E2; border-color: #FECACA; }
  .prio-较高 { background: #FFEDD5; border-color: #FED7AA; }
  .prio-普通 { background: #FEF3C7; border-color: #FDE68A; }
  .prio-较低 { background: #E0F2FE; border-color: #BAE6FD; }
  .prio-最低 { background: #DCFCE7; border-color: #BBF7D0; }
  .badge-meta { background: #FFFFFF; border-color: #E2E8F0; color: #64748B; }
  .badge-points { background: #EEF2FF; border-color: #E0E7FF; color: #3730A3; font-weight: 600; }
  .badge-comments { background: #F1F5F9; border-color: #E2E8F0; color: #475569; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 11px; padding: 5px 8px; border-radius: 6px; background: #FFF1F2; border: 1px solid #FECDD3; color: #9F1239; }

  #loading { padding: 80px 0; text-align: center; color: #64748B; font-size: 14px; }
  #empty { padding: 80px 0; text-align: center; color: #94A3B8; font-size: 13px; display: none; }
</style>
</head>
<body>
  <div id="loading">正在加载看板…</div>
  <div id="empty">当前筛选下没有工作项</div>
  <div id="board"></div>

<script>
(function () {
  var boardEl = document.getElementById('board');
  var state = { columns: [], byId: {} };
  var suppressClick = false;

  var CATEGORY_ORDER = ['未开始', '进行中', '可测试', '测试中', '已完成', '已关闭'];
  var SEVERITY_COLORS = { '致命': '#DC2626', '严重': '#DC2626', '主要': '#F59E0B', '一般': '#F59E0B', '次要': '#10B981', '轻微': '#10B981' };

  function classify(category) {
    switch (category) {
      case '进行中': return 'inprogress';
      case '已完成': return 'completed';
      case '已关闭': return 'closed';
      case '可测试': return 'testable';
      case '测试中': return 'testing';
      default: return 'default';
    }
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null && text !== '') node.textContent = text;
    return node;
  }

  function buildCard(item) {
    var cls = classify(item.category);
    var card = el('div', 'card');
    card.draggable = true;
    card.dataset.id = item.id;

    var bar = el('div', 'bar bar-' + cls);
    card.appendChild(bar);

    var head = el('div', 'card-head');
    head.appendChild(el('div', 'card-id', item.identifier));
    if (item.avatar) {
      var img = document.createElement('img');
      img.className = 'avatar';
      img.src = item.avatar;
      img.onerror = function () { img.remove(); };
      head.appendChild(img);
    } else if (item.assignee) {
      head.appendChild(el('div', 'card-id', item.assignee));
    }
    card.appendChild(head);

    card.appendChild(el('div', 'card-title', item.title));

    var badges = el('div', 'badges');
    badges.appendChild(el('span', 'badge badge-status', item.status));
    if (item.isDefect && item.severity) {
      var sev = el('span', 'badge badge-severity');
      var dot = el('span', 'dot');
      dot.style.background = SEVERITY_COLORS[item.severity] || '#6B7280';
      sev.appendChild(dot);
      sev.appendChild(document.createTextNode(item.severity));
      badges.appendChild(sev);
    }
    if (item.priority) {
      badges.appendChild(el('span', 'badge badge-priority prio-' + item.priority, item.priority));
    }
    if (item.startText || item.endText) {
      var range = item.startText && item.endText && item.startText !== item.endText
        ? item.startText + ' ~ ' + item.endText
        : (item.startText || item.endText);
      badges.appendChild(el('span', 'badge badge-meta', '📅 ' + range));
    }
    if (item.points) badges.appendChild(el('span', 'badge badge-points', String(item.points)));
    if (item.commentCount) badges.appendChild(el('span', 'badge badge-comments', String(item.commentCount)));
    card.appendChild(badges);

    if (item.tags && item.tags.length) {
      var tags = el('div', 'tags');
      item.tags.forEach(function (t) { tags.appendChild(el('span', 'tag', t)); });
      card.appendChild(tags);
    }

    card.addEventListener('dragstart', function (e) {
      suppressClick = true;
      e.dataTransfer.setData('text/plain', item.id);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', function () {
      card.classList.remove('dragging');
      setTimeout(function () { suppressClick = false; }, 50);
    });
    card.addEventListener('click', function () {
      if (suppressClick) return;
      post({ type: 'openDetail', id: item.id });
    });
    return card;
  }

  function buildColumn(col) {
    var wrap = el('div', 'col');
    wrap.dataset.category = col.title;

    // 计数与故事点由前端按列内项自算（宿主载荷不含 count/points）
    var count = (col.items || []).length;
    var points = (col.items || []).reduce(function (s, it) { return s + (it.points || 0); }, 0);
    var pointsText = (Math.round(points * 10) / 10).toString();

    var head = el('div', 'col-head');
    var colCls = classify(col.title);
    var title = el('div', 'col-title');
    title.appendChild(el('span', 'col-dot dot-' + colCls));
    title.appendChild(el('span', null, col.title));
    head.appendChild(title);
    head.appendChild(el('div', 'col-meta', '数量 · ' + count + '  ·  故事点 · ' + pointsText));
    wrap.appendChild(head);

    var body = el('div', 'col-body');
    col.items.forEach(function (item) {
      var card = buildCard(item);
      state.byId[item.id] = { card: card, category: col.title, item: item };
      body.appendChild(card);
    });
    wrap.appendChild(body);

    wrap.addEventListener('dragover', function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      wrap.classList.add('drag-over');
    });
    wrap.addEventListener('dragleave', function () { wrap.classList.remove('drag-over'); });
    wrap.addEventListener('drop', function (e) {
      e.preventDefault();
      wrap.classList.remove('drag-over');
      var id = e.dataTransfer.getData('text/plain');
      if (!id) return;
      var entry = state.byId[id];
      if (!entry || entry.category === col.title) return;
      // 乐观移动：先在界面上移过去，宿主推送权威渲染纠正
      body.appendChild(entry.card);
      entry.category = col.title;
      post({ type: 'moveItem', id: id, to: col.title });
    });
    return wrap;
  }

  function render(payload) {
    var scrollY = window.scrollY;
    state = { columns: payload.columns || [], byId: {} };
    boardEl.innerHTML = '';
    document.getElementById('loading').style.display = 'none';
    var total = 0;
    state.columns.forEach(function (col) {
      total += (col.items || []).length;
      boardEl.appendChild(buildColumn(col));
    });
    document.getElementById('empty').style.display = total === 0 ? 'block' : 'none';
    window.scrollTo(0, scrollY);
  }

  function post(msg) {
    // 直接 post 对象（宿主读 WebMessageAsJson）；字符串会被归入 WebMessageAsString
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(msg);
    }
  }

  window.applyBoard = function (data) {
    // 兼容两种入参：宿主 ExecuteScriptAsync 传入的对象字面量，或字符串化 JSON
    try {
      var payload = (typeof data === 'string') ? JSON.parse(data) : data;
      if (!payload) return;
      render(payload.columns ? payload : { columns: [] });
    } catch (e) {
      // 渲染异常时保持现状并上报宿主日志
      post({ type: 'renderError', message: String(e && e.message || e) });
    }
  };

  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'render') render(e.data.payload);
  });

  post({ type: 'ready' });
})();
</script>
</body>
</html>
