<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  html { scrollbar-gutter: stable; }  /* 滚动条空间常驻：内容高度变化时布局零横移 */
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #F1F5F9;
    overflow-y: auto;
    overflow-x: hidden;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 0 14px;
    padding: 0 18px 28px;
    /* 短列拉伸与最长列等高：列背景/边框延伸到整页深度，空白区也是合法拖放目标，
       滚动到长列深处时任何一列的横向条带始终完整可投 */
    align-items: stretch;
    min-height: 100%;
  }
  .col {
    display: flex;
    flex-direction: column;
    background: #FAFBFC;
    border: 1px solid #E2E8F0;
    border-top: none;
    border-radius: 0 0 12px 12px;
    min-width: 0;
  }
  /* 列头：sticky 常驻视口；每列带状态色点 */
  .col-head {
    position: sticky;
    top: 0;
    z-index: 5;
    background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
    border: 1px solid #E2E8F0;
    border-radius: 12px 12px 0 0;
    padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
  }
  .col-title { font-size: 14px; font-weight: 700; color: #0F172A; display: flex; align-items: center; gap: 7px; }
  .col-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot-inprogress { background: #F59E0B; }
  .dot-testable { background: #3B82F6; }
  .dot-testing { background: #8B5CF6; }
  .dot-completed { background: #10B981; }
  .dot-closed { background: #94A3B8; }
  .dot-default { background: #CBD5E1; }
  .col-meta { font-size: 12px; color: #64748B; margin-top: 5px; letter-spacing: .2px; }
  .col-body { padding: 2px; min-height: 60px; }
  .col.drag-over { background: #EFF6FF; border-color: #60A5FA; }

  /* 卡片 */
  .card {
    position: relative;
    margin: 11px 10px 10px;
    padding: 12px 13px 12px 19px;
    border: 1px solid #E2E8F0;
    border-radius: 10px;
    background: #FFFFFF;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
    cursor: grab;
    display: flex; flex-direction: column;
    transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(15, 23, 42, .10);
    border-color: #CBD5E1;
    z-index: 2;
  }
  .card.dragging { opacity: .45; }
  .card .bar {
    position: absolute; left: 5px; top: 14px; bottom: 14px; width: 4px; border-radius: 2px;
  }
  /* 状态只用左条区分，卡片统一白底 */
  .bar-inprogress { background: #F59E0B; }
  .bar-completed  { background: #10B981; }
  .bar-closed     { background: #94A3B8; }
  .bar-testable { background: #3B82F6; }
  .bar-testing  { background: #8B5CF6; }
  .bar-default  { background: #CBD5E1; }

  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-id { font-size: 12px; color: #64748B; font-weight: 600; letter-spacing: .3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; flex: none; border: 1px solid #E2E8F0; }
  .card { margin-top: 11px; }
  .card-title {
    font-size: 13.5px; font-weight: 600; color: #1E293B;
    margin-top: 8px; line-height: 1.45; word-break: break-all;
    min-height: calc(1.45em * 2);   /* 标题恒定占两行：短标题不产生空白带 */
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* 徽章区：自然换行完整显示，不再截断 */
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .badge {
    font-size: 11px; line-height: 1; padding: 5px 8px; border-radius: 6px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .badge-status { background: #EFF6FF; border-color: #BFDBFE; color: #1D4ED8; }
  .badge-severity { background: #F8FAFC; border-color: #E2E8F0; color: #334155; display: inline-flex; align-items: center; gap: 5px; }
  .badge-severity .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .badge-priority { background: #F1F5F9; border-color: #E2E8F0; color: #0F172A; font-weight: 600; }
  .prio-最高 { background: #FEE2E2; border-color: #FECACA; }
  .prio-较高 { background: #FFEDD5; border-color: #FED7AA; }
  .prio-普通 { background: #FEF3C7; border-color: #FDE68A; }
  .prio-较低 { background: #E0F2FE; border-color: #BAE6FD; }
  .prio-最低 { background: #DCFCE7; border-color: #BBF7D0; }
  .badge-meta { background: #FFFFFF; border-color: #E2E8F0; color: #64748B; }
  .badge-points { background: #EEF2FF; border-color: #E0E7FF; color: #3730A3; font-weight: 600; }
  .badge-comments { background: #F1F5F9; border-color: #E2E8F0; color: #475569; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 11px; padding: 5px 8px; border-radius: 6px; background: #FFF1F2; border: 1px solid #FECDD3; color: #9F1239; }

  #loading { padding: 80px 0; text-align: center; color: #64748B; font-size: 14px; }
  #empty { padding: 80px 0; text-align: center; color: #94A3B8; font-size: 13px; display: none; }

  /* 拖拽目标快捷条（暂不启用：短列已拉伸等高，任意视口深度均可直接拖到对应列；
     需要时取消注释并恢复 dragstart/dragend/render 三处调用即可）
  #dropbar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(80px);
    display: flex; gap: 10px; padding: 10px 12px;
    background: rgba(15, 23, 42, .92); border-radius: 14px;
    box-shadow: 0 12px 32px rgba(15, 23, 42, .35);
    opacity: 0; pointer-events: none; z-index: 99;
    transition: transform .18s ease, opacity .18s ease;
  }
  #dropbar.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
  #dropbar .drop-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px; border-radius: 10px; cursor: default;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .18);
    color: #E2E8F0; font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  #dropbar .drop-pill .d-dot { width: 8px; height: 8px; border-radius: 50%; }
  #dropbar .drop-pill.drag-over { background: rgba(37, 99, 235, .35); border-color: #60A5FA; color: #fff; }
  */
</style>
</head>
<body>
  <div id="loading">正在加载看板…</div>
  <div id="empty">当前筛选下没有工作项</div>
  <div id="board"></div>

<!-- 拖拽目标快捷条（暂不启用，需要时取消注释并恢复 JS 三处调用）
<div id="dropbar"></div>
-->

<script>
(function () {
  var boardEl = document.getElementById('board');
  var state = { columns: [], byId: {} };
  var suppressClick = false;
  var prefetched = {};
  var dragInProgress = false;
  var pendingRenderPayload = null;
  // 拖拽预校验：dragstart 时记录被拖卡片的可达列集合（空数组/未加载 = 不限制）
  var dragReachable = null;

  var CATEGORY_ORDER = ['未开始', '进行中', '可测试', '测试中', '已完成', '已关闭'];
  var SEVERITY_COLORS = { '致命': '#DC2626', '严重': '#DC2626', '主要': '#F59E0B', '一般': '#F59E0B', '次要': '#10B981', '轻微': '#10B981', '建议': '#10B981' };

  function classify(category) {
    switch (category) {
      case '进行中': return 'inprogress';
      case '已完成': return 'completed';
      case '已关闭': return 'closed';
      case '可测试': return 'testable';
      case '测试中': return 'testing';
      default: return 'default';
    }
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null && text !== '') node.textContent = text;
    return node;
  }

  function buildCard(item) {
    var cls = classify(item.category);
    var card = el('div', 'card');
    card.draggable = true;
    card.dataset.id = item.id;
    var hoverTimer = null;

    var bar = el('div', 'bar bar-' + cls);
    card.appendChild(bar);

    var head = el('div', 'card-head');
    head.appendChild(el('div', 'card-id', item.identifier));
    if (item.avatar) {
      var img = document.createElement('img');
      img.className = 'avatar';
      img.src = avatarKey(item.avatar);  // 规范化地址：浏览器 HTTP 缓存跨刷新命中
      img.onerror = function () { img.remove(); };
      head.appendChild(img);
    } else if (item.assignee) {
      head.appendChild(el('div', 'card-id', item.assignee));
    }
    card.appendChild(head);

    card.appendChild(el('div', 'card-title', item.title));

    var badges = el('div', 'badges');
    badges.appendChild(el('span', 'badge badge-status', item.status));
    if (item.isDefect && item.severity) {
      var sev = el('span', 'badge badge-severity');
      var dot = el('span', 'dot');
      dot.style.background = SEVERITY_COLORS[item.severity] || '#6B7280';
      sev.appendChild(dot);
      sev.appendChild(document.createTextNode(item.severity));
      badges.appendChild(sev);
    }
    if (item.priority) {
      badges.appendChild(el('span', 'badge badge-priority prio-' + item.priority, item.priority));
    }
    if (item.startText || item.endText) {
      var range = item.startText && item.endText && item.startText !== item.endText
        ? item.startText + ' ~ ' + item.endText
        : (item.startText || item.endText);
      badges.appendChild(el('span', 'badge badge-meta', '📅 ' + range));
    }
    if (item.points) badges.appendChild(el('span', 'badge badge-points', String(item.points)));
    if (item.commentCount) badges.appendChild(el('span', 'badge badge-comments', String(item.commentCount)));
    card.appendChild(badges);

    if (item.tags && item.tags.length) {
      var tags = el('div', 'tags');
      item.tags.forEach(function (t) { tags.appendChild(el('span', 'tag', t)); });
      card.appendChild(tags);
    }

    card.addEventListener('dragstart', function (e) {
      suppressClick = true;
      dragInProgress = true;
      dragReachable = (item.reachable || []).slice();
      e.dataTransfer.setData('text/plain', item.id);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
      // showDropbar(); // 快捷条暂不启用（短列等高拉伸后任意位置可直接拖放）
    });
    card.addEventListener('dragend', function () {
      card.classList.remove('dragging');
      dragInProgress = false;
      dragReachable = null;
      // hideDropbar(); // 快捷条暂不启用
      setTimeout(function () { suppressClick = false; }, 50);
      // 拖拽期间挂起的刷新在松手后应用，避免渲染移动节点打断进行中的拖拽
      if (pendingRenderPayload) {
        var pending = pendingRenderPayload;
        pendingRenderPayload = null;
        render(pending);
      }
    });
    card.addEventListener('mouseenter', function () {
      // 悬停 350ms 才预取：鼠标扫过不触发，砍掉无效请求洪峰
      if (prefetched[item.id]) return;
      if (hoverTimer) clearTimeout(hoverTimer);
      hoverTimer = setTimeout(function () {
        hoverTimer = null;
        if (prefetched[item.id]) return;
        prefetched[item.id] = true;
        post({ type: 'prefetchDetail', id: item.id });
      }, 150);
    });
    card.addEventListener('mouseleave', function () {
      if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
    });
    card.addEventListener('click', function () {
      if (suppressClick) return;
      post({ type: 'openDetail', id: item.id });
    });
    return card;
  }

  function buildColumn(col) {
    var wrap = el('div', 'col');
    wrap.dataset.category = col.title;

    // 计数与故事点由前端按列内项自算（宿主载荷不含 count/points）
    var count = (col.items || []).length;
    var points = (col.items || []).reduce(function (s, it) { return s + (it.points || 0); }, 0);
    var pointsText = (Math.round(points * 10) / 10).toString();

    var head = el('div', 'col-head');
    var colCls = classify(col.title);
    var title = el('div', 'col-title');
    title.appendChild(el('span', 'col-dot dot-' + colCls));
    title.appendChild(el('span', null, col.title));
    head.appendChild(title);
    head.appendChild(el('div', 'col-meta', '数量 · ' + count + '  ·  故事点 · ' + pointsText));
    wrap.appendChild(head);

    var body = el('div', 'col-body');
    col.items.forEach(function (item) {
      var card = buildCard(item);
      card.dataset.sig = itemSig(item);
      state.byId[item.id] = { card: card, category: col.title, item: item };
      body.appendChild(card);
    });
    wrap.appendChild(body);

    wrap.addEventListener('dragover', function (e) {
      // 拖拽预校验：目标列不在该卡可达集合（非空时）→ 不接受投放（光标禁止、松手原地不动）
      if (dragReachable && dragReachable.length > 0 && dragReachable.indexOf(col.title) < 0) {
        return;
      }
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      wrap.classList.add('drag-over');
    });
    wrap.addEventListener('dragleave', function () { wrap.classList.remove('drag-over'); });
    wrap.addEventListener('drop', function (e) {
      e.preventDefault();
      wrap.classList.remove('drag-over');
      // 与 dragover 同步的可达性守卫（防御 drop 绕过）
      if (dragReachable && dragReachable.length > 0 && dragReachable.indexOf(col.title) < 0) {
        return;
      }
      var id = e.dataTransfer.getData('text/plain');
      if (!id) return;
      var entry = state.byId[id];
      if (!entry || entry.category === col.title) return;
      // 乐观移动：先在界面上移过去，宿主推送权威渲染纠正
      body.appendChild(entry.card);
      entry.category = col.title;
      post({ type: 'moveItem', id: id, to: col.title });
    });
    return wrap;
  }

  // 头像地址规范化（去查询参数）：URL 携带动态签名/时间戳参数时，
  // 签名与移植比较仍稳定，避免周期性整板卡片重建闪烁
  function avatarKey(url) {
    if (!url) return '';
    var q = url.indexOf('?');
    return q >= 0 ? url.substring(0, q) : url;
  }

  // 卡片显示签名：字段变化才重建该卡片。刻意不含 category——跨列移动时卡片内容
  // 并未变化，位置由列归属决定，增量渲染直接搬运原节点（零重绘零闪烁）
  function itemSig(it) {
    return [it.id, it.identifier, it.title, it.status, it.assignee, avatarKey(it.avatar),
            it.priority, it.severity, it.isDefect, it.points, it.startText, it.endText,
            it.commentCount, (it.tags || []).join(','), (it.reachable || []).join(',')].join('~');
  }

  function columnTitlesSig(cols) {
    // 排序后比较：列集合相同即视为结构未变，杜绝额外类别列出现顺序抖动引发的误判全量重建
    return (cols || []).map(function (c) { return c.title; }).slice().sort().join('|');
  }

  function fullRender(cols) {
    var scrollY = window.scrollY;
    state.columns = cols || [];
    state.byId = {};
    document.getElementById('loading').style.display = 'none';
    // 原子替换：先在离屏 fragment 构建全部列，再一次 replaceChildren——
    // 浏览器只见一帧，彻底消灭逐列 append 的中间态白屏
    var fragment = document.createDocumentFragment();
    var total = 0;
    state.columns.forEach(function (col) {
      total += (col.items || []).length;
      fragment.appendChild(buildColumn(col));
    });
    boardEl.replaceChildren(fragment);
    document.getElementById('empty').style.display = total === 0 ? 'block' : 'none';
    window.scrollTo(0, scrollY);
  }

  // 增量渲染：列结构与卡片节点常驻，仅增/删/移动/就地更新——5 秒刷新小变化零闪烁
  function incrementalRender(cols) {
    var newById = {};
    // 跨列全局索引：卡片搬运原节点（保留解码位图与事件监听），不做销毁重建
    var prevById = state.byId || {};
    state.byId = newById;
    state.columns = cols || [];

    // 列按 dataset.category 匹配（不按索引）：列 DOM 顺序与数据顺序的任何历史不一致
    // 都不会导致卡片错位搬运（整屏闪的根源之一）
    var colElByCategory = {};
    Array.prototype.forEach.call(boardEl.children, function (colEl) {
      var cat = colEl.dataset && colEl.dataset.category;
      if (cat) colElByCategory[cat] = colEl;
    });

    var rebuiltCount = 0, movedCount = 0;
    state.columns.forEach(function (col) {
      var colEl = colElByCategory[col.title];
      if (!colEl) return; // 数据中有而 DOM 没有 → 下轮签名判定会走全量原子替换
      var body = colEl.querySelector('.col-body');
      var desired = col.items || [];

      // 列头计数就地刷新
      var count = desired.length;
      var points = desired.reduce(function (s, it) { return s + (it.points || 0); }, 0);
      var pointsText = (Math.round(points * 10) / 10).toString();
      var meta = colEl.querySelector('.col-meta');
      if (meta) meta.textContent = '数量 · ' + count + '  ·  故事点 · ' + pointsText;

      // 本列处理前的卡片快照（供收尾清理；跨列移动的节点 parentNode 已变，由守卫跳过）
      var snapshot = Array.prototype.slice.call(body.children);

      // 按目标顺序最少移动归位：跨列卡片直接搬运原节点（保留解码位图与事件，杜绝重建闪烁）
      for (var i = 0; i < desired.length; i++) {
        var item = desired[i];
        var sig = itemSig(item);
        var prev = prevById[item.id];
        var card;
        if (prev && prev.card && prev.card.dataset.sig === sig) {
          card = prev.card;
        } else {
          card = buildCard(item);
          card.dataset.sig = sig;
          rebuiltCount++;
          if (prev && prev.card) {
            // 头像位图移植：地址（忽略查询参数）相同时沿用旧节点已解码的 img，
            // 避免重建引发的图片重新解码闪烁
            var oldImg = prev.card.querySelector('img.avatar');
            var newImg = card.querySelector('img.avatar');
            if (oldImg && newImg && avatarKey(oldImg.getAttribute('src')) === avatarKey(newImg.getAttribute('src'))) {
              newImg.parentNode.replaceChild(oldImg, newImg);
            }

            // 关键：移除被替换的旧节点（无论它在哪一列）——否则同列内容变化会残留副本
            if (prev.card.parentNode) {
              prev.card.parentNode.removeChild(prev.card);
            }
          }
        }

        // 位置正确则零操作，否则按位插入（insertBefore 保留节点身份）
        if (body.children[i] !== card) {
          movedCount++;
          body.insertBefore(card, body.children[i] || null);
        }
        newById[item.id] = { card: card, category: col.title, item: item };
      }

      // 收尾清理：本列中不再存在且仍挂在本列的卡片
      var keptIds = {};
      desired.forEach(function (it) { keptIds[it.id] = true; });
      snapshot.forEach(function (cardEl) {
        if (cardEl.dataset && cardEl.dataset.id && !keptIds[cardEl.dataset.id] && cardEl.parentNode === body) {
          body.removeChild(cardEl);
        }
      });
    });

    var total = 0;
    state.columns.forEach(function (c) { total += (c.items || []).length; });
    document.getElementById('empty').style.display = total === 0 ? 'block' : 'none';

    // 清道夫兜底：全板扫描，同 id 多节点或未注册的孤儿卡片一律移除——
    // 即使存在未知泄漏路径，用户也绝不会看到重复卡片
    var seenIds = {};
    var allCards = boardEl.querySelectorAll('.card');
    for (var d = 0; d < allCards.length; d++) {
      var c = allCards[d];
      var cid = c.dataset && c.dataset.id;
      if (!cid) continue;
      var registered = state.byId[cid] && state.byId[cid].card === c;
      if (seenIds[cid] || !registered) {
        if (c.parentNode) c.parentNode.removeChild(c);
      } else {
        seenIds[cid] = true;
      }
    }

    // 渲染统计上报：重建/移动卡数（宿主日志），异常放大一眼可见
    post({ type: 'renderStats', to: '重建 ' + rebuiltCount + ' / 移动 ' + movedCount + ' / 共 ' + total });
  }

  function render(payload) {
    // 拖拽进行中：挂起本轮渲染，dragend 后应用（避免移动节点打断拖拽）
    if (dragInProgress) {
      pendingRenderPayload = payload;
      return;
    }

    var cols = payload.columns || [];
    // 首次渲染或列集合变化（新增/减少状态列）才整板重建（原子替换），其余走增量差分
    if (!state.ready || columnTitlesSig(state.columns) !== columnTitlesSig(cols)) {
      post({ type: 'renderMode', mode: 'full', reason: state.ready ? 'columns-changed' : 'first' });
      fullRender(cols);
      state.ready = true;
      // rebuildDropbar(); // 快捷条暂不启用
      return;
    }

    post({ type: 'renderMode', mode: 'incremental', reason: '' });
    incrementalRender(cols);
  }

  function post(msg) {
    // 直接 post 对象（宿主读 WebMessageAsJson）；字符串会被归入 WebMessageAsString
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(msg);

  }

  /* ===== 拖拽目标快捷条（暂不启用：短列已拉伸等高，任意视口深度均可直接拖到对应列；
     恢复步骤：取消本段注释 + 恢复 HTML 中的 <div id="dropbar"> + CSS 样式段 +
     dragstart/dragend/render 三处调用） =====

    dropbarEl.classList.remove('show');

  window.applyBoard = function (data) {
    // 兼容两种入参：宿主 ExecuteScriptAsync 传入的对象字面量，或字符串化 JSON
    try {
      var payload = (typeof data === 'string') ? JSON.parse(data) : data;
      if (!payload) return;
      render(payload.columns ? payload : { columns: [] });
    } catch (e) {
      // 渲染异常时保持现状并上报宿主日志
      post({ type: 'renderError', message: String(e && e.message || e) });
    }
  };

  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'render') render(e.data.payload);
  });

  post({ type: 'ready' });
})();
